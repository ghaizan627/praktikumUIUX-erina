    <h1>form pemesanan pizza</h1>
    <p>silakan isi form pemesanan ini dengan lengkap dan benar.</p>

    <form action="#" method="post">
        <fieldset>
            <legend>Informasi Pemesan</legend>

                <label for="customername">Nama:</label>

<html lang="en">
<body>
  <form action="#" method="post">
    <fieldset>
      <!-- Menambahkan label dan mengubah type menjadi "tel" -->
      <p>
        <label for="telephone">Telephone:</label>
        <input type="tel" id="telephone" name="telephone" required>
      </p>
      
      <!-- Memperbaiki typo <p%> menjadi <p> -->
      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </p>
      
      <!-- Memperbaiki typo "intruction" menjadi "instruction" -->
      <p>
        <label for="instruction">Delivery Instruction:</label><br>
        <textarea
          id="instruction"
          name="instruction"
          rows="4"
          cols="50"
          maxlength="400"
          placeholder="No more than 400 characters"></textarea>
      </p>
    </fieldset>
  </form>
</body>
</html>
